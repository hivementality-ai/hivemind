name: System Tests

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  system-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: hivemind
          POSTGRES_PASSWORD: hivemind
          POSTGRES_DB: hivemind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://hivemind:hivemind@localhost:5432/hivemind_test
      REDIS_URL: redis://localhost:6379/0
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: test_primary_key_000000000000000000
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: test_deterministic_key_0000000000000
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: test_salt_0000000000000000000000000

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Setup database
        run: bin/rails db:prepare

      - name: Run system tests
        run: bundle exec rspec spec/system
        env:
          DISABLE_SIMPLECOV: "1"

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: system-test-screenshots
          path: tmp/capybara/
          retention-days: 7
