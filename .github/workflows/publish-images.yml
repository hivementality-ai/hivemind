name: Publish Docker Images

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: app
            context: .
            dockerfile: Dockerfile
          - image: workspace
            context: .
            dockerfile: Dockerfile.workspace
          - image: connector
            context: ./connector
            dockerfile: Dockerfile
          - image: sdk-proxy
            context: ./sdk-proxy
            dockerfile: Dockerfile
          - image: browser-sidecar
            context: ./browser-sidecar
            dockerfile: Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Determine image tags
        id: tags
        env:
          PREFIX: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAGS="${PREFIX}:${VERSION}"
          if [[ "$VERSION" != *-rc* ]]; then
            TAGS="${TAGS}"$'\n'"${PREFIX}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            HIVEMIND_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Make packages publicly pullable (GHCR defaults new packages to private)
  make-public:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      packages: write
    strategy:
      matrix:
        image: [app, workspace, connector, sdk-proxy, browser-sidecar]
    steps:
      - name: Make ${{ matrix.image }} package public
        run: |
          curl -sf -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/${{ github.repository_owner }}/packages/container/$(echo '${{ github.event.repository.name }}%2F${{ matrix.image }}')/visibility" \
            -d '{"visibility":"public"}' || echo "::warning::Could not set ${{ matrix.image }} to public — set manually in GitHub Package Settings"
