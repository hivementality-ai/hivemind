name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the details below so we can reproduce and fix it.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "When I try to X, Y happens instead of Z."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Paste relevant logs (`docker compose logs app`) or attach screenshots.
      render: shell

  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - Docker Compose (recommended)
        - Manual
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Hivemind version
      description: "Check with: `GET /api/v1/system/version` or the dashboard footer"
      placeholder: "2026.02.1"

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Docker version, browser, etc.
      placeholder: "Ubuntu 24.04, Docker 27.x, Chrome 132"
