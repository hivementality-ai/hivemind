services:
  docker-proxy:
    image: alpine/socat:latest
    command: tcp-listen:2375,fork,reuseaddr unix-connect:/var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    volumes:
      - workspace_data:/workspace
      - active_storage_data:/rails/storage
      - rclone_config:/rails/storage/rclone
      - ${HOME}/hivemind-agents-shared:/app/agents-shared
    env_file: .env
    environment:
      - DATABASE_URL=postgres://hivemind:hivemind@db:5432/hivemind_production
      - REDIS_URL=redis://cache:6379/0
      - RAILS_ENV=production
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
      - RAILS_SERVE_STATIC_FILES=true
      - DOCKER_HOST=tcp://docker-proxy:2375
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal
      - web

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: bundle exec sidekiq -C config/sidekiq.yml
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    volumes:
      - workspace_data:/workspace
      - active_storage_data:/rails/storage
      - rclone_config:/rails/storage/rclone
      - ${HOME}/hivemind-agents-shared:/app/agents-shared
    env_file: .env
    environment:
      - DATABASE_URL=postgres://hivemind:hivemind@db:5432/hivemind_production
      - REDIS_URL=redis://cache:6379/0
      - RAILS_ENV=production
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
      - DOCKER_HOST=tcp://docker-proxy:2375
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal

  db:
    image: pgvector/pgvector:pg17
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=hivemind
      - POSTGRES_PASSWORD=hivemind
      - POSTGRES_DB=hivemind_production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hivemind"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  cache:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  browser:
    image: mcr.microsoft.com/playwright:v1.52.0-noble
    command: npx playwright run-server --port 3001
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
    networks:
      - internal
      - web

  workspace:
    build:
      context: .
      dockerfile: Dockerfile.workspace
    volumes:
      - workspace_data:/workspace
      - workspace_home:/home/agent
      - ${HOME}/hivemind-agents-shared:/app/agents-shared
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2.0"
    networks:
      - web

  connector:
    build:
      context: ./connector
      dockerfile: Dockerfile
    depends_on:
      - app
    environment:
      - HIVEMIND_URL=http://app:3000
      - CONNECTOR_PORT=3002
      - AUTH_STORE_PATH=/app/auth
    volumes:
      - connector_auth:/app/auth
    ports:
      - "3002:3002"
    networks:
      - internal
      - web

volumes:
  postgres_data:
  redis_data:
  workspace_data:
  workspace_home:
  active_storage_data:
  connector_auth:
  rclone_config:

networks:
  internal:
    driver: bridge
  web:
    driver: bridge
