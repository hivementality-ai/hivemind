services:
  docker-proxy:
    image: alpine/socat:latest
    command: tcp-listen:2375,fork,reuseaddr unix-connect:/var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal
    restart: unless-stopped

  app:
    image: ghcr.io/hivementality-ai/hivemind/app:${HIVEMIND_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8080}:3000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    volumes:
      - workspace_data:/workspace
      - active_storage_data:/rails/storage
      - rclone_config:/rails/storage/rclone
      - ${AGENTS_SHARED_DIR:-/hivemind-agents-shared-unset}:/app/agents-shared
      - ./plugins:/rails/plugins
      - .:/host-hivemind
    env_file: .env
    environment:
      - DATABASE_URL=postgres://hivemind:hivemind@db:5432/hivemind_production
      - REDIS_URL=redis://cache:6379/0
      - RAILS_ENV=production
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:-${RAILS_MASTER_KEY}}
      - RAILS_SERVE_STATIC_FILES=true
      - DOCKER_HOST=tcp://docker-proxy:2375
      - HIVEMIND_HOST_DIR=/host-hivemind
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - MEMORY_EMBEDDINGS_ENABLED=${MEMORY_EMBEDDINGS_ENABLED:-true}
      - MEMORY_EMBEDDINGS_PROVIDER=${MEMORY_EMBEDDINGS_PROVIDER:-ollama}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - BROWSER_SIDECAR_URL=http://browser-sidecar:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY:-1g}
          cpus: "${APP_CPUS:-1.0}"
    networks:
      - internal
      - web

  # System worker — handles heartbeats, task pipeline transitions, notifications,
  # delivery queues, and lightweight housekeeping jobs. This process must NEVER
  # stall behind long-running agent LLM work.
  worker-system:
    image: ghcr.io/hivementality-ai/hivemind/app:${HIVEMIND_VERSION:-latest}
    command: bundle exec sidekiq -C config/sidekiq.yml
    depends_on:
      app:
        condition: service_started
      cache:
        condition: service_healthy
    volumes:
      - workspace_data:/workspace
      - active_storage_data:/rails/storage
      - rclone_config:/rails/storage/rclone
      - ${AGENTS_SHARED_DIR:-/hivemind-agents-shared-unset}:/app/agents-shared
      - ./plugins:/rails/plugins
    env_file: .env
    environment:
      - DATABASE_URL=postgres://hivemind:hivemind@db:5432/hivemind_production
      - REDIS_URL=redis://cache:6379/0
      - RAILS_ENV=production
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:-${RAILS_MASTER_KEY}}
      - DOCKER_HOST=tcp://docker-proxy:2375
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - MEMORY_EMBEDDINGS_ENABLED=${MEMORY_EMBEDDINGS_ENABLED:-true}
      - MEMORY_EMBEDDINGS_PROVIDER=${MEMORY_EMBEDDINGS_PROVIDER:-ollama}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - BROWSER_SIDECAR_URL=http://browser-sidecar:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: ${SIDEKIQ_SYSTEM_MEMORY:-512m}
          cpus: "${SIDEKIQ_SYSTEM_CPUS:-0.5}"
    networks:
      - internal

  # Agent worker — handles ChatStreamJob, InboundMessageJob, SubAgentJob,
  # and other long-running LLM sessions. Isolated from system jobs so agent
  # work can never starve heartbeats or task transitions.
  worker-agents:
    image: ghcr.io/hivementality-ai/hivemind/app:${HIVEMIND_VERSION:-latest}
    command: bundle exec sidekiq -C config/sidekiq_agents.yml
    depends_on:
      app:
        condition: service_started
      cache:
        condition: service_healthy
    volumes:
      - workspace_data:/workspace
      - active_storage_data:/rails/storage
      - rclone_config:/rails/storage/rclone
      - ${AGENTS_SHARED_DIR:-/hivemind-agents-shared-unset}:/app/agents-shared
      - ./plugins:/rails/plugins
    env_file: .env
    environment:
      - DATABASE_URL=postgres://hivemind:hivemind@db:5432/hivemind_production
      - REDIS_URL=redis://cache:6379/0
      - RAILS_ENV=production
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:-${RAILS_MASTER_KEY}}
      - DOCKER_HOST=tcp://docker-proxy:2375
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - MEMORY_EMBEDDINGS_ENABLED=${MEMORY_EMBEDDINGS_ENABLED:-true}
      - MEMORY_EMBEDDINGS_PROVIDER=${MEMORY_EMBEDDINGS_PROVIDER:-ollama}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - BROWSER_SIDECAR_URL=http://browser-sidecar:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: ${SIDEKIQ_AGENT_MEMORY:-1g}
          cpus: "${SIDEKIQ_AGENT_CPUS:-1.0}"
    networks:
      - internal

  db:
    image: pgvector/pgvector:pg17
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=hivemind
      - POSTGRES_PASSWORD=hivemind
      - POSTGRES_DB=hivemind_production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hivemind"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${DB_MEMORY:-1g}
          cpus: "${DB_CPUS:-1.0}"
    networks:
      - internal

  cache:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  browser-sidecar:
    image: ghcr.io/hivementality-ai/hivemind/browser-sidecar:${HIVEMIND_VERSION:-latest}
    build:
      context: ./browser-sidecar
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - internal
      - web
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${BROWSER_MEMORY:-2g}
          cpus: "${BROWSER_CPUS:-1.0}"

  workspace:
    image: ghcr.io/hivementality-ai/hivemind/workspace:${HIVEMIND_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile.workspace
    volumes:
      - workspace_data:/workspace
      - workspace_home:/home/agent
      - ${AGENTS_SHARED_DIR:-/hivemind-agents-shared-unset}:/app/agents-shared
    tmpfs:
      - /tmp/gws-creds:size=10M,mode=0700
    deploy:
      resources:
        limits:
          memory: ${WORKSPACE_MEMORY:-4g}
          cpus: "${WORKSPACE_CPUS:-2.0}"
    networks:
      - web

  sdk-proxy:
    image: ghcr.io/hivementality-ai/hivemind/sdk-proxy:${HIVEMIND_VERSION:-latest}
    build:
      context: ./sdk-proxy
      dockerfile: Dockerfile
    volumes:
      - workspace_data:/workspace
      - ${AGENTS_SHARED_DIR:-/hivemind-agents-shared-unset}:/app/agents-shared
    environment:
      - PORT=3003
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - RAILS_INTERNAL_URL=http://app:3000
    networks:
      - internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${SDK_PROXY_MEMORY:-2g}
          cpus: "${SDK_PROXY_CPUS:-0.5}"

  connector:
    image: ghcr.io/hivementality-ai/hivemind/connector:${HIVEMIND_VERSION:-latest}
    build:
      context: ./connector
      dockerfile: Dockerfile
    depends_on:
      - app
    environment:
      - HIVEMIND_URL=http://app:3000
      - CONNECTOR_PORT=3002
      - AUTH_STORE_PATH=/app/auth
      # Optional: auto-start Telegram (otherwise configured dynamically via Channels UI)
      # - TELEGRAM_BOT_TOKEN=
      # Optional: auto-start Signal (otherwise configured dynamically via Channels UI)
      # - SIGNAL_PHONE_NUMBER=
      # - SIGNAL_API_URL=http://signal-cli:8080
    volumes:
      - connector_auth:/app/auth
    ports:
      - "${CONNECTOR_PORT:-3002}:3002"
    deploy:
      resources:
        limits:
          memory: ${CONNECTOR_MEMORY:-256m}
          cpus: "${CONNECTOR_CPUS:-0.5}"
    networks:
      - internal
      - web

  signal-cli:
    image: bbernhard/signal-cli-rest-api:latest
    environment:
      - MODE=normal
    volumes:
      - signal_data:/home/.local/share/signal-cli
    deploy:
      resources:
        limits:
          memory: ${SIGNAL_MEMORY:-256m}
          cpus: "${SIGNAL_CPUS:-0.25}"
    networks:
      - internal
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  workspace_data:
  workspace_home:
  active_storage_data:
  connector_auth:
  rclone_config:
  signal_data:

networks:
  internal:
    driver: bridge
  web:
    driver: bridge
