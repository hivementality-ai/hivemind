# Sidekiq Interactive Worker — runs only turns a person is waiting on.
# Its own process and thread pool, so heartbeats, schedules, sub-agents and
# coding jobs on the agents queue can never take these threads.
#
# Run with: bundle exec sidekiq -C config/sidekiq_interactive.yml
---
:concurrency: <%= ENV.fetch('SIDEKIQ_INTERACTIVE_CONCURRENCY', 3).to_i %>
:queues:
  - interactive
