# Default scheduled jobs
# Agent-created jobs are managed via the ScheduledTask model

session_archival:
  cron: "0 4 * * *"
  class: "SessionArchivalJob"
  queue: "low"
  description: "Archive old session transcripts"

audit_cleanup:
  cron: "0 3 * * 0"
  class: "AuditCleanupJob"
  queue: "low"
  description: "Clean up audit logs older than retention period"

budget_reset:
  cron: "0 0 * * *"
  class: "BudgetResetJob"
  queue: "default"
  description: "Reset daily agent budgets"

stuck_turn_sweep:
  cron: "*/5 * * * *"
  class: "StuckTurnSweepJob"
  queue: "system"
  description: "Clear chat turns interrupted by a worker restart"

library_folder_scan:
  cron: "*/5 * * * *"
  class: "LibraryFolderScanJob"
  queue: "system"
  description: "Ingest new and changed files from the watched library folder"

expire_approvals:
  cron: "*/15 * * * *"
  class: "ExpireApprovalsJob"
  queue: "low"
  description: "Expire approval requests nobody answered in 24 hours"
