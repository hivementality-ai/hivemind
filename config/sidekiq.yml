# Sidekiq System Worker — handles system-critical + lightweight jobs.
# This process must NEVER stall behind long-running agent work.
#
# Run with: bundle exec sidekiq -C config/sidekiq.yml
---
:concurrency: <%= ENV.fetch('SIDEKIQ_SYSTEM_CONCURRENCY', 5).to_i %>
:queues:
  - [critical, 6]
  - [system, 5]
  - [default, 3]
  - [low, 2]
