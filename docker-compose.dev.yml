# Development override — run with:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Or add to .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml
#
# This mounts your local source code into containers so changes are
# picked up immediately (no image rebuild needed).

services:
  app:
    image: hivemind-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/rails:cached
      - bundle_cache:/usr/local/bundle
      - node_modules:/rails/node_modules
      - workspace_data:/workspace
      - active_storage_data:/rails/storage
      - ${HOME}/hivemind-agents-shared:/app/agents-shared
    environment:
      - RAILS_ENV=development
      - DATABASE_URL=postgres://hivemind:hivemind@db:5432/hivemind_development
      - REDIS_URL=redis://cache:6379/0
      - DOCKER_HOST=tcp://docker-proxy:2375
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - MEMORY_EMBEDDINGS_ENABLED=${MEMORY_EMBEDDINGS_ENABLED:-true}
      - MEMORY_EMBEDDINGS_PROVIDER=${MEMORY_EMBEDDINGS_PROVIDER:-ollama}
      - SDK_PROXY_URL=http://sdk-proxy:3003
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-hivemind-internal-dev-secret}
    env_file: .env
    command: bash -c "bin/rails db:prepare && bin/rails db:seed && bin/rails tailwindcss:build && bin/rails server -b 0.0.0.0 -p 3000"
    stdin_open: true
    tty: true

  worker:
    image: hivemind-dev
    volumes:
      - .:/rails:cached
      - bundle_cache:/usr/local/bundle
      - node_modules:/rails/node_modules
      - workspace_data:/workspace
      - active_storage_data:/rails/storage
      - ${HOME}/hivemind-agents-shared:/app/agents-shared
    environment:
      - RAILS_ENV=development
      - DATABASE_URL=postgres://hivemind:hivemind@db:5432/hivemind_development
      - REDIS_URL=redis://cache:6379/0
      - DOCKER_HOST=tcp://docker-proxy:2375
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - MEMORY_EMBEDDINGS_ENABLED=${MEMORY_EMBEDDINGS_ENABLED:-true}
      - MEMORY_EMBEDDINGS_PROVIDER=${MEMORY_EMBEDDINGS_PROVIDER:-ollama}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-hivemind-internal-dev-secret}
    env_file: .env
    command: bundle exec sidekiq -C config/sidekiq.yml

  db:
    environment:
      - POSTGRES_DB=hivemind_development

  sdk-proxy:
    build:
      context: ./sdk-proxy
      dockerfile: Dockerfile
    volumes:
      - ./sdk-proxy:/app:cached
      - sdk_proxy_modules:/app/node_modules
      - workspace_data:/workspace
      - ${HOME}/hivemind-agents-shared:/app/agents-shared
    environment:
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-hivemind-internal-dev-secret}
      - RAILS_INTERNAL_URL=http://app:3000
    command: npx nodemon server.js

  connector:
    volumes:
      - ./connector:/app/src:cached

volumes:
  bundle_cache:
  node_modules:
  sdk_proxy_modules:
